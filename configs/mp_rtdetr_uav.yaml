seed: 42
device: cuda
num_classes: 10
input_size: 640
batch_size: 8
num_workers: 4
epochs: 100
lr: 0.0001
weight_decay: 0.0005
amp: true

model:
  width: 256
  num_queries: 300
  edge_gate: true
  iou_aware_query: true

dataset:
  train_images: data/VisDrone/train/images
  train_labels: data/VisDrone/train/labels
  val_images: data/VisDrone/val/images
  val_labels: data/VisDrone/val/labels

augment:
  hflip: 0.5
  hsv: 0.4
  mosaic: 0.0

save_dir: outputs/exp
