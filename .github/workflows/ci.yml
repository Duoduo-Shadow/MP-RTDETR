name: Basic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax)
        run: |
          python -m py_compile tools/train.py tools/val.py tools/demo_infer.py
          python -m py_compile src/models/mp_rtdetr.py src/models/modules.py src/models/losses.py
          python -m py_compile src/datasets/yolo_dataset.py src/postprocess.py
          python -m py_compile src/utils/nms.py src/utils/metrics.py src/utils/logger.py src/utils/viz.py

      - name: Import smoke test
        run: |
          python - << 'PY'
          import torch
          from src.models import MPRTDETR

          m = MPRTDETR(num_classes=10, width=256, num_queries=100)
          x = torch.randn(1, 3, 640, 640)
          y = m(x)
          assert 'pred' in y and y['pred'].ndim == 3
          print('smoke_ok', y['pred'].shape)
          PY
